[workspace]
members = ["crates/pt-core", "crates/pt-term", "crates/pt-cli", "crates/pt-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wensincai/putty-rs"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "sync", "signal"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
vte = "0.15"
unicode-width = "0.2"
crossterm = "0.28"
indicatif = "0.17"
rpassword = "7"
dirs = "6"
eframe = "0.33"
egui = "0.33"

# 体积优化：不影响功能，仅在 release 生效
[profile.release]
strip = true          # 去除符号表与调试信息
lto = "fat"           # 跨 crate 全量优化，剔除死代码
codegen-units = 1     # 单编译单元，配合 lto 剔除更彻底
panic = "abort"       # 放弃 unwind 表（代码中未使用 catch_unwind）
opt-level = "z"       # 按体积优化
